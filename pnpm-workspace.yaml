overrides:
  # Avisos de seguridad en dependencias transitivas que sus paquetes padre
  # todavía no han subido.
  ws: "^8.21.0" # GHSA ws <8.21.0 (ethers)
  form-data: "^4.0.6" # CRLF injection (axios)
  uuid: "^11.1.1" # bounds check en v3/v5/v6 (@chainsafe/bls-keystore)
  js-yaml@3: "^3.15.2" # DoS merge keys + CPU cuadratico en !!omap (jest > babel-plugin-istanbul)
  brace-expansion@1: "^1.1.18" # DoS expansion exponencial + OOM (jest > glob)
  brace-expansion@2: "^2.1.4" # DoS expansion exponencial + OOM (jest > glob > minimatch)
  brace-expansion@5: "^5.0.9" # DoS arrays intermedios sin limite (eslint > minimatch)
  browserslist: "^4.28.7" # OOM por cache sin eviccion + crash via browserslist-stats.json (jest > @babel/core)
  baseline-browser-mapping: "^2.11.0" # DoS por terminacion de proceso con entrada invalida (jest > browserslist)
  "@babel/core": "^7.29.1" # lectura arbitraria via sourceMappingURL (jest)
# Cuarentena de supply chain: no instalar nada publicado hace menos de 7 dias.
# 7 * 24 * 60 = 10080 minutos. No se desactiva ni se reduce.
#
# Sin minimumReleaseAgeExclude a proposito. Cada exclusion es un agujero
# permanente en la politica: antes dejaba entrar baseline-browser-mapping
# publicado hacia 4 dias.
#
# Si un install se para con ERR_PNPM_MISSING_TIME, no es que el registry no
# publique el campo "time": es que quedo cacheado un metadata abreviado, que no
# lo incluye. Se arregla con `pnpm cache delete <paquete>`, nunca excluyendo el
# paquete ni bajando minimumReleaseAge.
minimumReleaseAge: 10080

# El default de pnpm para esta opcion es `true`, y con `true` pnpm no falla
# cuando el metadata de un paquete no trae el campo "time": avisa con un WARN
# ("skipping the minimumReleaseAge check for this package") e instala esa
# version sin comprobar su edad. En false la politica es fail-closed: si no se
# puede verificar la edad, el install se para en vez de seguir.
minimumReleaseAgeIgnoreMissingTime: false
packageManagerStrict: true
engineStrict: true
allowBuilds:
  # Los bindings nativos llegan precompilados como optionalDependencies,
  # no hace falta compilar nada en el install.
  unrs-resolver: false
  "@parcel/watcher": false   # llega via jest 30.5.x
